---
- name: Check whether Hermes user lingering is enabled
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - show-user
      - "{{ hermes_agent_user }}"
      - --property=Linger
      - --value
  register: hermes_agent_linger_status
  changed_when: false
  failed_when: false

- name: Enable Hermes user lingering
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ hermes_agent_user }}"
  when: hermes_agent_linger_status.stdout | trim != 'yes'
  changed_when: true

- name: Check whether the Hermes user gateway unit exists
  become: true
  ansible.builtin.stat:
    path: "{{ hermes_agent_gateway_unit_path }}"
  register: hermes_agent_user_gateway_unit

- name: Install the Hermes user gateway service
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - gateway
      - install
      - --start-now
      - --start-on-login
  environment: "{{ hermes_agent_runtime_environment | combine(hermes_agent_user_systemd_environment) }}"
  when: not hermes_agent_user_gateway_unit.stat.exists
  register: hermes_agent_gateway_install_result
  changed_when: hermes_agent_gateway_install_result.rc == 0
  failed_when: hermes_agent_gateway_install_result.rc != 0

- name: Ensure the Hermes user gateway is enabled and started
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_gateway_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
    scope: user
  environment: "{{ hermes_agent_runtime_environment | combine(hermes_agent_user_systemd_environment) }}"
