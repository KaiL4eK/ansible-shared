---
- name: Validate prepared service
  ansible.builtin.assert:
    that:
      - llama_cpp_effective_image is string
      - llama_cpp_effective_image | length > 0
    fail_msg: "Run the prepare step before start."

- name: Stop docker compose project before start (force clean restart)
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_remote_dir }}"
    state: stopped
    remove_orphans: true

- name: Start llama-cpp service over Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_remote_dir }}"
    pull: "{{ 'never' if llama_cpp_build_enabled | bool else 'missing' }}"
    build: never
    state: present
    remove_orphans: true
    wait: true

- name: Show deployment info
  ansible.builtin.debug:
    msg: |
      llama.cpp is deployed on http://{{ ansible_default_ipv4.address }}:{{ llama_cpp_port }}
      Image: {{ llama_cpp_effective_image }}
      Model repo: {{ llama_cpp_hf_model_repo }}
