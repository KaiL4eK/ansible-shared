- name: Read current Telegram enabled state
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - get
      - platforms.telegram.enabled
  environment: "{{ hermes_agent_runtime_environment }}"
  register: hermes_agent_current_telegram_enabled
  changed_when: false
  failed_when: false

- name: Set Telegram enabled state
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - set
      - platforms.telegram.enabled
      - "{{ hermes_agent_telegram_enabled | ternary('true', 'false') }}"
  environment: "{{ hermes_agent_runtime_environment }}"
  when: >-
    hermes_agent_current_telegram_enabled.rc != 0 or
    hermes_agent_current_telegram_enabled.stdout | trim !=
    (hermes_agent_telegram_enabled | ternary('true', 'false'))
  changed_when: true
  notify: Restart Hermes gateway

- name: Read current Telegram user allowlist
  become: true
