---
hermes_git_backup_repository_url: https://example.invalid/hermes.git
hermes_git_backup_token: fake
hermes_git_backup_github_token: ""
hermes_git_backup_username: git
hermes_git_backup_user_home: /home/hermes
hermes_git_backup_directory: "{{ hermes_git_backup_user_home }}/.hermes"
hermes_git_backup_branch: main
hermes_git_backup_remote: origin
hermes_git_backup_user: hermes
hermes_git_backup_group: "{{ hermes_git_backup_user }}"
hermes_git_backup_binary_path: "{{ hermes_git_backup_user_home }}/.local/bin/hermes"
hermes_git_backup_author_name: Hermes Agent
hermes_git_backup_author_email: hermes@localhost
hermes_git_backup_commit_message: Automated Hermes backup
hermes_git_backup_gitignore_content: |
  .env
  *.log
  __pycache__/
hermes_git_backup_config_directory: "{{ hermes_git_backup_user_home }}/.config/hermes-git-backup"
hermes_git_backup_credentials_path: "{{ hermes_git_backup_config_directory }}/credentials"
hermes_git_backup_marker_path: "{{ hermes_git_backup_config_directory }}/initialized"
hermes_git_backup_script_path: /usr/local/sbin/hermes-git-backup
hermes_git_backup_cron_path: /etc/cron.d/hermes-git-backup
hermes_git_backup_cron_name: Hermes Git backup
hermes_git_backup_cron_expression: "0 * * * *"
hermes_git_backup_cron_timezone: ""
hermes_git_backup_scheduler_package: cron
hermes_git_backup_scheduler_service_name: cron
