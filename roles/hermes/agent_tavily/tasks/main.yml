---
- name: Validate Hermes Agent Tavily inputs
  ansible.builtin.assert:
    that:
      - hermes_agent_tavily_home | length > 0
      - hermes_agent_tavily_binary_path | length > 0
      - hermes_agent_tavily_token | length > 0
      - "'\n' not in hermes_agent_tavily_token"
      - "'\r' not in hermes_agent_tavily_token"
      - hermes_agent_tavily_web_backend | length > 0
  no_log: true

- name: Configure Hermes Agent Tavily environment
  ansible.builtin.include_role:
    name: hermes/agent_env  # noqa role-name[path]
  vars:
    hermes_agent_env_user: "{{ hermes_agent_tavily_user }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_group: "{{ hermes_agent_tavily_group }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_user_home: "{{ hermes_agent_tavily_user_home }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_home: "{{ hermes_agent_tavily_home }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_binary_path: "{{ hermes_agent_tavily_binary_path }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_values:  # noqa var-naming[no-role-prefix]
      TAVILY_API_KEY: "{{ hermes_agent_tavily_token }}"

- name: Read current Hermes Agent web backend
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_tavily_binary_path }}"
      - config
      - get
      - web.backend
  environment:
    HERMES_HOME: "{{ hermes_agent_tavily_home }}"
  register: hermes_agent_tavily_current_web_backend
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Configure Hermes Agent Tavily web backend
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_tavily_binary_path }}"
      - config
      - set
      - web.backend
      - "{{ hermes_agent_tavily_web_backend }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_tavily_home }}"
  when: >-
    not ansible_check_mode and
    (hermes_agent_tavily_current_web_backend.rc != 0 or
    hermes_agent_tavily_current_web_backend.stdout | trim != hermes_agent_tavily_web_backend
    )
  changed_when: true
  notify: Restart Hermes Agent gateway

- name: Verify Hermes Agent configuration
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_tavily_binary_path }}"
      - config
      - check
  environment:
    HERMES_HOME: "{{ hermes_agent_tavily_home }}"
  changed_when: false
  when: not ansible_check_mode
