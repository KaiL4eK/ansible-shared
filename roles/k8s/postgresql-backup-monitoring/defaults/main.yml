---
backup_monitoring_namespace: postgresql-backup-monitoring  # noqa var-naming[no-role-prefix]
backup_monitoring_service_account_name: postgresql-backup-monitoring  # noqa var-naming[no-role-prefix]

backup_monitoring_backup_schedule: "0 8 * * 5"  # noqa var-naming[no-role-prefix]
backup_monitoring_check_schedule: "0 18 * * *"  # noqa var-naming[no-role-prefix]
backup_monitoring_timezone: Europe/Moscow  # noqa var-naming[no-role-prefix]

# Версия pg_dump/pg_restore обязана совпадать с мажор-минором сервера-источника:
# плавающий 17-alpine привозил pg_dump 17.10 при сервере 17.6, а его рендер
# opclass без схемы ломал restore на trgm-индексах (ADR-49).
backup_monitoring_job_image: postgres:17.6-alpine  # noqa var-naming[no-role-prefix]
backup_monitoring_db_image_repository: bitnamilegacy/postgresql  # noqa var-naming[no-role-prefix]
backup_monitoring_db_image_tag: 17.6.0-debian-12-r4  # noqa var-naming[no-role-prefix]
backup_monitoring_storage_class: nfs  # noqa var-naming[no-role-prefix]
backup_monitoring_backup_storage_size: 50Gi  # noqa var-naming[no-role-prefix]

backup_monitoring_backup_root: /backups  # noqa var-naming[no-role-prefix]
backup_monitoring_lock_dir_name: .backup-check.lock  # noqa var-naming[no-role-prefix]
backup_monitoring_backup_retention_count: 10  # noqa var-naming[no-role-prefix]

backup_monitoring_backup_pvc_name: postgresql-backup-monitoring-pvc  # noqa var-naming[no-role-prefix]
backup_monitoring_backup_scripts_configmap_name: >-  # noqa var-naming[no-role-prefix]
  postgresql-backup-monitoring-backup-scripts
backup_monitoring_check_scripts_configmap_name: >-  # noqa var-naming[no-role-prefix]
  postgresql-backup-monitoring-check-scripts
backup_monitoring_backup_secret_name: postgresql-backup-monitoring-backup-env  # noqa var-naming[no-role-prefix]
backup_monitoring_check_secret_name: postgresql-backup-monitoring-check-env  # noqa var-naming[no-role-prefix]

backup_monitoring_db_release_name: postgresql-backup-monitoring-postgresql  # noqa var-naming[no-role-prefix]
backup_monitoring_db_chart_version: 16.7.27  # noqa var-naming[no-role-prefix]
backup_monitoring_db_admin_user: postgres  # noqa var-naming[no-role-prefix]
backup_monitoring_db_admin_password: ""  # noqa var-naming[no-role-prefix]

# Verification-БД прогоняет полные restore всех копий: дефолтных ресурсов
# чарта bitnami (requests 128Mi / limits 192Mi) при shared_buffers 128MB
# не хватает — cgroup-OOM во время восстановления (checkpointer/backend
# убиваются signal 9, pg_restore рвёт соединение). Память — с запасом на
# restore, autovacuum вставок и crash-recovery (ADR-06).
backup_monitoring_db_resources:  # noqa var-naming[no-role-prefix]
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
backup_monitoring_check_db_name: postgres  # noqa var-naming[no-role-prefix]
backup_monitoring_db_internal_host: >-  # noqa var-naming[no-role-prefix]
  {{ backup_monitoring_db_release_name ~ '.' ~
    backup_monitoring_namespace ~ '.svc.cluster.local' }}
backup_monitoring_db_internal_port: 5432  # noqa var-naming[no-role-prefix]

backup_monitoring_source_db_host: postgresql.service.svc.cluster.local  # noqa var-naming[no-role-prefix]
backup_monitoring_source_db_port: 5432  # noqa var-naming[no-role-prefix]
backup_monitoring_source_db_user: postgres  # noqa var-naming[no-role-prefix]
backup_monitoring_source_db_password: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_source_db_name: postgres  # noqa var-naming[no-role-prefix]
backup_monitoring_ignored_databases: []  # noqa var-naming[no-role-prefix]
backup_monitoring_ignored_table_data: {}  # noqa var-naming[no-role-prefix]

backup_monitoring_teams_webhook_url: ""  # noqa var-naming[no-role-prefix]

backup_monitoring_backup_concurrency_policy: Forbid  # noqa var-naming[no-role-prefix]
backup_monitoring_check_concurrency_policy: Forbid  # noqa var-naming[no-role-prefix]
backup_monitoring_starting_deadline_seconds: 1800  # noqa var-naming[no-role-prefix]
backup_monitoring_successful_jobs_history_limit: 2  # noqa var-naming[no-role-prefix]
backup_monitoring_failed_jobs_history_limit: 5  # noqa var-naming[no-role-prefix]
backup_monitoring_job_ttl_seconds: 86400  # noqa var-naming[no-role-prefix]

# Жёсткие границы времени выполнения Job: зависший pg_dump/pg_restore не
# держит NFS-лок вечно (activeDeadlineSeconds -> SIGTERM, trap успевает
# отпустить лок; SIGKILL-случай покрывает steal-логика лока ниже)
backup_monitoring_backup_active_deadline_seconds: 14400  # noqa var-naming[no-role-prefix]
backup_monitoring_check_active_deadline_seconds: 14400  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_active_deadline_seconds: 14400  # noqa var-naming[no-role-prefix]

# Лок старше порога считается брошенным (владелец гарантированно убит своим
# activeDeadlineSeconds) и захватывается следующим джобом с warning в лог.
# Порог обязан превышать самый большой дедлайн джобов
backup_monitoring_lock_max_age_seconds: 18000  # noqa var-naming[no-role-prefix]

# Freshness-проверка: последняя копия старше порога (расписание + буфер,
# бэкап еженедельный) = failed + Teams, даже если сама копия консистентна
backup_monitoring_backup_max_age_seconds: 691200  # noqa var-naming[no-role-prefix]

backup_monitoring_restore_job_name: postgresql-backup-monitoring-restore  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_scripts_configmap_name: >-  # noqa var-naming[no-role-prefix]
  postgresql-backup-monitoring-restore-scripts
backup_monitoring_restore_target_db_name: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_backup_name: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_request_id: manual  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_wait_retries: 180  # noqa var-naming[no-role-prefix]
backup_monitoring_restore_wait_delay: 10  # noqa var-naming[no-role-prefix]

# Отдельная точка входа restore-isolated: не использует production SOURCE_DB_*.
backup_monitoring_isolated_target_namespace: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_isolated_target_release: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_isolated_target_host: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_isolated_admin_password: ""  # noqa var-naming[no-role-prefix]
backup_monitoring_isolated_resources:  # noqa var-naming[no-role-prefix]
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
