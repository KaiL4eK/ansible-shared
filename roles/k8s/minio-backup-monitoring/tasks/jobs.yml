---
- name: Ensure MinIO backup CronJob exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'backup-cronjob.yml.j2') | from_yaml }}"

- name: Ensure MinIO backup verification CronJob exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'check-cronjob.yml.j2') | from_yaml }}"
