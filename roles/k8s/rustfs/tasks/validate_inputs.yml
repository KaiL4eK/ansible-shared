---
# Валидация входов роли (REQ-4): до первого изменяющего действия. Файл
# выделен, чтобы валидацию можно было прогонять скретч-плейбуком отдельно
# от основной логики роли (include_role с tasks_from: validate_inputs.yml).
# Сообщения assert не видят vars: своей задачи — значения готовятся set_fact.
# В списках ошибок только имена переменных и условия, никогда значения:
# среди входов креды, assert выводит evaluated-выражения наружу.
- name: Собрать карту обязательных входов
  ansible.builtin.set_fact:
    k8s_rustfs_mandatory_inputs:
      k8s_rustfs_namespace: "{{ k8s_rustfs_namespace }}"
      k8s_rustfs_release_name: "{{ k8s_rustfs_release_name }}"
      k8s_rustfs_chart_ref: "{{ k8s_rustfs_chart_ref }}"
      k8s_rustfs_chart_version: "{{ k8s_rustfs_chart_version }}"
      k8s_rustfs_chart_repository_name: "{{ k8s_rustfs_chart_repository_name }}"
      k8s_rustfs_chart_repository_url: "{{ k8s_rustfs_chart_repository_url }}"
      # Креды обязательны только при credentials_source=values; в режиме
      # generated роль обеспечит их сама (заглушка, чтобы проверка была единой).
      k8s_rustfs_access_key: "{{ k8s_rustfs_access_key if (k8s_rustfs_credentials_source == 'values') else 'generated' }}"
      k8s_rustfs_secret_key: "{{ k8s_rustfs_secret_key if (k8s_rustfs_credentials_source == 'values') else 'generated' }}"
      k8s_rustfs_storage_class: "{{ k8s_rustfs_storage_class }}"
      k8s_rustfs_data_storage_size: "{{ k8s_rustfs_data_storage_size }}"
      k8s_rustfs_log_storage_size: "{{ k8s_rustfs_log_storage_size }}"
      # Хосты ingress обязательны только при enabled: true — вне режима
      # подставляем заведомо непустую заглушку, чтобы проверка была единой.
      k8s_rustfs_ingress_api_host: >-
        {{ k8s_rustfs_ingress_api_host if (k8s_rustfs_ingress_enabled | bool) else 'n/a' }}
      k8s_rustfs_ingress_console_host: >-
        {{ k8s_rustfs_ingress_console_host if (k8s_rustfs_ingress_enabled | bool) else 'n/a' }}
      # Теги образов: пустой тег в чарте подменяется на appVersion/'stable' —
      # недопустимая плавающая версия, требуем явный пин.
      k8s_rustfs_image_tag: "{{ k8s_rustfs_image_values.tag | default('') }}"
      k8s_rustfs_init_image_tag: "{{ k8s_rustfs_init_image_values.tag | default('') }}"

- name: Собрать список пустых обязательных входов
  ansible.builtin.set_fact:
    k8s_rustfs_empty_inputs: >-
      {{ k8s_rustfs_mandatory_inputs | dict2items
         | selectattr('value', 'match', '^$')
         | map(attribute='key') | list }}

- name: Собрать список некорректных входов
  ansible.builtin.set_fact:
    k8s_rustfs_invalid_inputs: >-
      {{ (
        [] if (k8s_rustfs_credentials_source in ['values', 'generated'])
           else ['k8s_rustfs_credentials_source: допустимо values|generated'],
        [] if (k8s_rustfs_mode in ['standalone', 'distributed'])
           else ['k8s_rustfs_mode: ' ~ k8s_rustfs_mode ~ ' (допустимо standalone|distributed)'],
        [] if (k8s_rustfs_service_type in ['ClusterIP', 'NodePort', 'LoadBalancer'])
           else ['k8s_rustfs_service_type: ' ~ k8s_rustfs_service_type],
        [] if (k8s_rustfs_access_key != 'rustfsadmin')
           else ['k8s_rustfs_access_key: well-known rustfsadmin — чарт отклонит рендер'],
        [] if (k8s_rustfs_secret_key != 'rustfsadmin')
           else ['k8s_rustfs_secret_key: well-known rustfsadmin — чарт отклонит рендер'],
        [] if (k8s_rustfs_mode != 'distributed' or k8s_rustfs_replica_count | int >= 2)
           else ['k8s_rustfs_replica_count: в distributed требуется >= 2'],
        [] if (k8s_rustfs_mode != 'distributed' or k8s_rustfs_drives_per_node is none or k8s_rustfs_drives_per_node | int >= 1)
           else ['k8s_rustfs_drives_per_node: в distributed требуется >= 1 или null (вывод чартом)'],
        [] if (k8s_rustfs_image_values is mapping and k8s_rustfs_init_image_values is mapping)
           else ['k8s_rustfs_image_values и k8s_rustfs_init_image_values должны быть mapping'],
        [] if (k8s_rustfs_resources is mapping)
           else ['k8s_rustfs_resources должен быть mapping'],
        [] if (k8s_rustfs_config is mapping)
           else ['k8s_rustfs_config должен быть mapping'],
        [] if (k8s_rustfs_node_selector is mapping)
           else ['k8s_rustfs_node_selector должен быть mapping'],
        [] if (k8s_rustfs_extra_env is sequence and k8s_rustfs_extra_env is not string and k8s_rustfs_extra_env is not mapping)
           else ['k8s_rustfs_extra_env должен быть списком']
      ) | flatten }}

- name: Проверить входы роли
  ansible.builtin.assert:
    that:
      - k8s_rustfs_empty_inputs | length == 0
      - k8s_rustfs_invalid_inputs | length == 0
    fail_msg: >-
      Некорректные входы роли k8s/rustfs (заполняет плейбук).
      Пустые: {{ k8s_rustfs_empty_inputs | join(', ') if k8s_rustfs_empty_inputs | length > 0 else 'нет' }}.
      Нарушения: {{ k8s_rustfs_invalid_inputs | join('; ') if k8s_rustfs_invalid_inputs | length > 0 else 'нет' }}.
    success_msg: Входы роли k8s/rustfs корректны
