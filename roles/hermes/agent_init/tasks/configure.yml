- name: Read current Hermes onboarding profile build mode
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - get
      - onboarding.profile_build
  environment: "{{ hermes_agent_runtime_environment }}"
  register: hermes_agent_current_onboarding_profile_build
  changed_when: false
  failed_when: hermes_agent_current_onboarding_profile_build.rc != 0

- name: Check whether onboarding profile build is explicitly configured
  become: true
  ansible.builtin.slurp:
    src: "{{ hermes_agent_config_file }}"
  register: hermes_agent_config_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: Detect explicit onboarding profile build configuration
  ansible.builtin.set_fact:
    hermes_agent_onboarding_profile_build_configured: >-
      {{
        (
          hermes_agent_config_raw.content | default('') | b64decode
          | default('{}', true) | from_yaml | default({}, true)
        ).get('onboarding', {}).get('profile_build')
        == hermes_agent_onboarding_profile_build
      }}
  no_log: true

- name: Set Hermes onboarding profile build mode
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - set
      - onboarding.profile_build
      - "{{ hermes_agent_onboarding_profile_build }}"
  environment: "{{ hermes_agent_runtime_environment }}"
  when:
    - hermes_agent_current_onboarding_profile_build.stdout | trim != hermes_agent_onboarding_profile_build
      or not hermes_agent_onboarding_profile_build_configured
  changed_when: true
  notify: Restart Hermes gateway
