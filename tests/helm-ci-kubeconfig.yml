---
- name: Verify Helm CI kubeconfig templates offline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    k8s_helm_ci_name: test-helm-ci
    k8s_helm_ci_namespace: test-apps
    k8s_helm_ci_manage_serviceaccounts: true
    k8s_helm_ci_manage_statefulsets: false
    k8s_helm_ci_manage_daemonsets: false
    k8s_helm_ci_manage_cronjobs: false
    k8s_helm_ci_manage_persistentvolumeclaims: false
    k8s_helm_ci_manage_horizontalpodautoscalers: false
    k8s_helm_ci_manage_poddisruptionbudgets: false
    k8s_helm_ci_manage_networkpolicies: false
    k8s_helm_ci_source_context:
      cluster: test-cluster
    k8s_helm_ci_source_cluster:
      server: https://kubernetes.example.test:6443
      certificate-authority-data: ZmFrZS1jZXJ0
    k8s_helm_ci_token_secret:
      resources:
        - data:
            token: ZmFrZS10b2tlbg==
    role_template_path: >-
      {{ playbook_dir | dirname }}/roles/k8s/helm-ci-kubeconfig/templates/role-rules.yml.j2
    kubeconfig_template_path: >-
      {{ playbook_dir | dirname }}/roles/k8s/helm-ci-kubeconfig/templates/kubeconfig.yml.j2
  tasks:
    - name: Render production permission and kubeconfig templates with synthetic credentials
      ansible.builtin.set_fact:
        rendered_rules: "{{ lookup('ansible.builtin.template', role_template_path) | from_yaml }}"
        rendered_kubeconfig: "{{ lookup('ansible.builtin.template', kubeconfig_template_path) | from_yaml }}"

    - name: Assert default RBAC stays namespaced and does not manage RBAC or tokens
      ansible.builtin.assert:
        that:
          - "'secrets' in rendered_rules[0].resources"
          - "'serviceaccounts' in rendered_rules[0].resources"
          - rendered_rules[0].verbs | sort == ['create', 'delete', 'get', 'list', 'patch', 'update', 'watch']
          - rendered_rules[4].resources == ['pods']
          - rendered_rules[4].verbs == ['get', 'list', 'watch']
          - rendered_rules[5].resources == ['replicasets']
          - "'*' not in (rendered_rules | map(attribute='resources') | flatten)"
          - "'roles' not in (rendered_rules | map(attribute='resources') | flatten)"
          - "'rolebindings' not in (rendered_rules | map(attribute='resources') | flatten)"
          - "'serviceaccounts/token' not in (rendered_rules | map(attribute='resources') | flatten)"
          - rendered_rules | length == 6
          - rendered_kubeconfig.contexts[0].context.namespace == 'test-apps'
          - rendered_kubeconfig.clusters[0].cluster.server == 'https://kubernetes.example.test:6443'
          - rendered_kubeconfig.clusters[0].cluster['certificate-authority-data'] == 'ZmFrZS1jZXJ0'
          - rendered_kubeconfig.users[0].user.token == 'fake-token'

    - name: Render optional resource permissions explicitly enabled
      ansible.builtin.set_fact:
        enabled_rules: "{{ lookup('ansible.builtin.template', role_template_path) | from_yaml }}"
      vars:
        k8s_helm_ci_manage_statefulsets: true
        k8s_helm_ci_manage_daemonsets: true
        k8s_helm_ci_manage_cronjobs: true
        k8s_helm_ci_manage_persistentvolumeclaims: true
        k8s_helm_ci_manage_horizontalpodautoscalers: true
        k8s_helm_ci_manage_poddisruptionbudgets: true
        k8s_helm_ci_manage_networkpolicies: true

    - name: Assert optional rules are added only for explicitly enabled resource types
      ansible.builtin.assert:
        that:
          - enabled_rules | length == 12
          - "'persistentvolumeclaims' in enabled_rules[0].resources"
          - enabled_rules[6].resources == ['statefulsets']
          - enabled_rules[7].resources == ['daemonsets']
          - enabled_rules[8].resources == ['cronjobs']
          - enabled_rules[9].resources == ['horizontalpodautoscalers']
          - enabled_rules[10].resources == ['poddisruptionbudgets']
          - enabled_rules[11].resources == ['networkpolicies']
