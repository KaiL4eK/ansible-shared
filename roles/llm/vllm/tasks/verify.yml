---
# Optional post-deploy verification (vllm_verify_enabled): issue real API
# requests against the running server and assert meaningful responses.
# The Compose healthcheck only proves /health responds; these checks prove
# the model is actually served and responds with real content.
# vllm_verify_mode selects the probe:
#   chat  — /v1/chat/completions generation check (default, chat models);
#   embed — /v1/embeddings vector check (pooling/embedding models).
# A score/rerank server is not covered by either probe yet; keep
# vllm_verify_enabled: false for those deployments.
- name: Resolve verification base URL
  ansible.builtin.set_fact:
    vllm_verify_base_url: "http://{{ ansible_default_ipv4.address }}:{{ vllm_port }}"

- name: Resolve verification target model id
  ansible.builtin.set_fact:
    # Multiple served aliases are passed as one space-separated string
    # (--served-model-name accepts nargs='+'), while /v1/models lists them
    # individually; the first alias is the canonical id used by metrics and
    # proxy mappings, so verify that one.
    vllm_verify_model_id: "{{ (vllm_served_model_name if vllm_served_model_name else vllm_model_name) | trim | split(' ') | first }}"

- name: Prepare verification API headers
  ansible.builtin.set_fact:
    vllm_verify_headers: >-
      {{ {'Authorization': 'Bearer ' ~ (vllm_api_key | string)}
         if (vllm_api_key | default('', true) | string | length > 0) else {} }}
  no_log: true

- name: Verify the selected verification mode is supported
  ansible.builtin.assert:
    that:
      - vllm_verify_mode in ['chat', 'embed']
    fail_msg: >-
      Unsupported vllm_verify_mode '{{ vllm_verify_mode }}':
      expected 'chat' or 'embed'.

- name: Request served models for verification
  ansible.builtin.uri:
    url: "{{ vllm_verify_base_url }}/v1/models"
    headers: "{{ vllm_verify_headers }}"
    return_content: true
    timeout: "{{ vllm_verify_timeout }}"
  no_log: true
  failed_when: false
  register: vllm_verify_models

- name: Verify served models response
  ansible.builtin.assert:
    that:
      - vllm_verify_models.status == 200
      - (vllm_verify_models.json | default({}, true)).data | default([]) | length > 0
      - vllm_verify_model_id in ((vllm_verify_models.json | default({}, true)).data | default([])) | map(attribute='id') | list
    fail_msg: >-
      Models verification failed for {{ vllm_verify_base_url }}/v1/models:
      expected model '{{ vllm_verify_model_id }}' to be served.
      HTTP status: {{ vllm_verify_models.status | default('n/a') }};
      served models: {{ (vllm_verify_models.json | default({}, true)).data | default([]) | map(attribute='id') | list }};
      detail: {{ vllm_verify_models.msg | default('') | truncate(300) }};
      body: {{ vllm_verify_models.content | default('') | truncate(300) }}
    success_msg: "Model '{{ vllm_verify_model_id }}' is served on {{ vllm_verify_base_url }}"

- name: Request verification chat completion
  ansible.builtin.uri:
    url: "{{ vllm_verify_base_url }}/v1/chat/completions"
    method: POST
    headers: "{{ vllm_verify_headers }}"
    body_format: json
    body:
      model: "{{ vllm_verify_model_id }}"
      messages:
        - role: user
          content: "{{ vllm_verify_prompt }}"
      max_tokens: "{{ vllm_verify_max_tokens | int }}"
      temperature: "{{ vllm_verify_temperature }}"
    return_content: true
    timeout: "{{ vllm_verify_timeout }}"
  no_log: true
  failed_when: false
  register: vllm_verify_completion
  when: vllm_verify_mode == 'chat'

- name: Verify chat completion HTTP response
  ansible.builtin.assert:
    that:
      - vllm_verify_completion.status == 200
      - vllm_verify_completion.json is defined
    fail_msg: >-
      Chat completion verification failed for {{ vllm_verify_base_url }}/v1/chat/completions.
      HTTP status: {{ vllm_verify_completion.status | default('n/a') }};
      detail: {{ vllm_verify_completion.msg | default('') | truncate(300) }};
      body: {{ vllm_verify_completion.content | default('') | truncate(300) }}
  when: vllm_verify_mode == 'chat'

- name: Extract verification completion content
  ansible.builtin.set_fact:
    vllm_verify_content: "{{ (vllm_verify_completion.json.choices[0].message.content | default('', true)) | trim }}"
  when: vllm_verify_mode == 'chat'

- name: Verify chat completion content is not empty
  ansible.builtin.assert:
    that:
      - vllm_verify_content | length > 0
    fail_msg: >-
      Chat completion returned empty content for prompt
      '{{ vllm_verify_prompt }}' (max_tokens={{ vllm_verify_max_tokens }});
      consider raising vllm_verify_max_tokens or adjusting vllm_verify_prompt.
      Body: {{ vllm_verify_completion.content | default('') | truncate(300) }}
  when: vllm_verify_mode == 'chat'

- name: Verify expected content substring
  ansible.builtin.assert:
    that:
      - vllm_verify_expect_contains | lower in vllm_verify_content | lower
    fail_msg: >-
      Expected '{{ vllm_verify_expect_contains }}' in completion content:
      {{ vllm_verify_content | truncate(300) }}
  when: vllm_verify_mode == 'chat' and vllm_verify_expect_contains | length > 0

- name: Request verification tool call completion
  ansible.builtin.uri:
    url: "{{ vllm_verify_base_url }}/v1/chat/completions"
    method: POST
    headers: "{{ vllm_verify_headers }}"
    body_format: json
    body:
      model: "{{ vllm_verify_model_id }}"
      messages:
        - role: user
          content: "{{ vllm_verify_tool_prompt }}"
      tools: "{{ vllm_verify_tools | from_json }}"
      tool_choice: auto
      max_tokens: "{{ vllm_verify_max_tokens | int }}"
      temperature: "{{ vllm_verify_temperature }}"
    return_content: true
    timeout: "{{ vllm_verify_timeout }}"
  no_log: true
  failed_when: false
  register: vllm_verify_tool_completion
  when: vllm_verify_mode == 'chat' and vllm_verify_tool_call_enabled | bool

- name: Extract verification tool call fields
  ansible.builtin.set_fact:
    vllm_verify_tool_calls: "{{ vllm_verify_tool_completion.json.choices[0].message.tool_calls | default([], true) }}"
    vllm_verify_tool_finish_reason: "{{ vllm_verify_tool_completion.json.choices[0].finish_reason | default('', true) }}"
  when: vllm_verify_mode == 'chat' and vllm_verify_tool_call_enabled | bool

- name: Verify tool call response is a valid OpenAI tool call
  ansible.builtin.assert:
    that:
      - vllm_verify_tool_completion.status == 200
      - vllm_verify_tool_calls | length > 0
      - vllm_verify_tool_calls[0]['function']['name'] == vllm_verify_tool_function_name
      - vllm_verify_tool_calls[0]['function']['arguments'] | from_json | length > 0
      - vllm_verify_tool_finish_reason == 'tool_calls'
    fail_msg: >-
      Tool call verification failed for {{ vllm_verify_base_url }}/v1/chat/completions.
      HTTP status: {{ vllm_verify_tool_completion.status | default('n/a') }};
      finish_reason: {{ vllm_verify_tool_finish_reason | default('n/a') }};
      tool_calls: {{ vllm_verify_tool_calls | default([]) | to_json | truncate(300) }};
      detail: {{ vllm_verify_tool_completion.msg | default('') | truncate(300) }};
      body: {{ vllm_verify_tool_completion.content | default('') | truncate(300) }}
    success_msg: >-
      Tool call verification OK: model {{ vllm_verify_model_id }} called
      '{{ vllm_verify_tool_calls[0]['function']['name'] }}' with args
      {{ vllm_verify_tool_calls[0]['function']['arguments'] }}
      (finish_reason: {{ vllm_verify_tool_finish_reason }})
  when: vllm_verify_mode == 'chat' and vllm_verify_tool_call_enabled | bool

- name: Request verification embedding
  ansible.builtin.uri:
    url: "{{ vllm_verify_base_url }}/v1/embeddings"
    method: POST
    headers: "{{ vllm_verify_headers }}"
    body_format: json
    body:
      model: "{{ vllm_verify_model_id }}"
      input: "{{ vllm_verify_prompt }}"
    return_content: true
    timeout: "{{ vllm_verify_timeout }}"
  no_log: true
  failed_when: false
  register: vllm_verify_embedding
  when: vllm_verify_mode == 'embed'

- name: Verify embedding HTTP response
  ansible.builtin.assert:
    that:
      - vllm_verify_embedding.status == 200
      - vllm_verify_embedding.json is defined
    fail_msg: >-
      Embedding verification failed for {{ vllm_verify_base_url }}/v1/embeddings.
      HTTP status: {{ vllm_verify_embedding.status | default('n/a') }};
      detail: {{ vllm_verify_embedding.msg | default('') | truncate(300) }};
      body: {{ vllm_verify_embedding.content | default('') | truncate(300) }}
  when: vllm_verify_mode == 'embed'

- name: Extract verification embedding vector
  ansible.builtin.set_fact:
    vllm_verify_vector: "{{ vllm_verify_embedding.json.data[0].embedding | default([], true) }}"
  when: vllm_verify_mode == 'embed'

- name: Verify embedding vector is not empty and numeric
  ansible.builtin.assert:
    that:
      - vllm_verify_vector | length > 0
      - vllm_verify_vector | first is number
    fail_msg: >-
      Embedding response has no usable vector for input
      '{{ vllm_verify_prompt }}'.
      Body: {{ vllm_verify_embedding.content | default('') | truncate(300) }}
  when: vllm_verify_mode == 'embed'

- name: Show verification result
  ansible.builtin.debug:
    msg: >-
      Verification OK: model {{ vllm_verify_model_id }} replied:
      {{ vllm_verify_content | truncate(200) }}
  when: vllm_verify_mode == 'chat'

- name: Show verification result
  ansible.builtin.debug:
    msg: >-
      Verification OK: model {{ vllm_verify_model_id }} returned a
      {{ vllm_verify_vector | length }}-dimension embedding.
  when: vllm_verify_mode == 'embed'
