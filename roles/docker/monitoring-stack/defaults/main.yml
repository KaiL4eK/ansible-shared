---
monitoring_stack_dir: "/home/{{ ansible_user }}/ansible/monitoring"
monitoring_stack_config_dir: "{{ monitoring_stack_dir }}/config"
monitoring_stack_jaeger_config_dir: "{{ monitoring_stack_config_dir }}/jaeger"
monitoring_stack_project_name: lrc-monitoring

# Сервисы можно включать независимо. Grafana datasource-конфигурация
# строится по тем же флагам.
monitoring_stack_enable_prometheus: true
monitoring_stack_enable_grafana: true
monitoring_stack_enable_loki: true
monitoring_stack_enable_jaeger: true

# Версии фиксированы и могут быть переопределены из playbook/inventory.
monitoring_stack_prometheus_image: "prom/prometheus:v3.13.2"
monitoring_stack_grafana_image: "grafana/grafana-enterprise:13.1.3"
monitoring_stack_loki_image: "grafana/loki:3.7.6"
monitoring_stack_jaeger_image: "jaegertracing/jaeger:2.20.0"
monitoring_stack_loki_storage_init_image: "alpine:3.22"
monitoring_stack_loki_uid: 10001
monitoring_stack_loki_gid: 10001
monitoring_stack_jaeger_storage_init_image: "alpine:3.22"
monitoring_stack_jaeger_uid: 10001
monitoring_stack_jaeger_gid: 10001

monitoring_stack_bind_address: "0.0.0.0"
monitoring_stack_prometheus_port: 9090
monitoring_stack_grafana_port: 3000
monitoring_stack_loki_port: 3100
monitoring_stack_jaeger_ui_port: 16686
monitoring_stack_jaeger_otlp_grpc_port: 4317
monitoring_stack_jaeger_otlp_http_port: 4318

# Переопределить через inventory или Ansible Vault перед реальным деплоем.
monitoring_stack_grafana_admin_user: admin
monitoring_stack_grafana_admin_password: admin

monitoring_stack_prometheus_scrape_interval: 15s
monitoring_stack_prometheus_retention: 30d
monitoring_stack_loki_retention: 30d
monitoring_stack_jaeger_retention: 720h
monitoring_stack_prometheus_scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

monitoring_stack_compose_pull: missing
monitoring_stack_compose_wait_timeout: 120
