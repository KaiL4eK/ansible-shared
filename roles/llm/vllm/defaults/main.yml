---
vllm_model_name: ""
vllm_served_model_name: ""

vllm_remote_dir: "/home/{{ ansible_user }}/ansible/vllm-{{ vllm_model_name | replace('/', '_') }}"
vllm_host_huggingface_cache_dir: "/home/{{ ansible_user }}/.cache/huggingface"
vllm_host_vllm_cache_dir: "{{ vllm_remote_dir }}/cache/vllm"
vllm_host_triton_cache_dir: "{{ vllm_remote_dir }}/cache/triton"
vllm_host_flashinfer_cache_dir: "{{ vllm_remote_dir }}/cache/flashinfer"
vllm_container_models_dir: /var/vllm_models

vllm_port: 8000
# https://hub.docker.com/r/vllm/vllm-openai/tags
vllm_image: vllm/vllm-openai
vllm_version: v0.16.0
vllm_compose_wait_timeout: 1800
# Compose healthcheck start period; the first start compiles the model
# (torch.compile), which can take longer than the default window.
# Example: 10m
vllm_healthcheck_start_period: 30s
# vllm/vllm-openai's ENTRYPOINT already runs "vllm serve", so command: starts
# with the model name. nvcr.io/nvidia/vllm uses the generic NVIDIA container
# entrypoint (/opt/nvidia/nvidia_entrypoint.sh), which execs command: verbatim
# without prepending "vllm serve" — set this to "vllm serve" for that image.
vllm_cli_command: ""
vllm_gpu_memory_utilization: "0.9"
vllm_gpu_devices: "all"
vllm_watermark:
vllm_mamba_ssm_cache_dtype:
vllm_max_num_partial_prefills:
vllm_max_long_partial_prefills:
vllm_long_prefill_token_threshold:
vllm_load_format:
vllm_attention_backend:
vllm_enable_prefix_caching: true
vllm_enable_auto_tool_choice: false
vllm_enable_prompt_tokens_details: true
vllm_speculative_config:
vllm_tool_call_parser:
vllm_kv_cache_dtype:
vllm_pull_enabled: true
vllm_entrypoint_checksum: ""

vllm_extra_env: {}

vllm_trust_remote_code: false
vllm_reasoning_parser:
vllm_max_model_len:
vllm_max_num_seqs:
vllm_max_num_batched_tokens:
vllm_pipeline_parallel_size: 1
# Set to auto to detect the number of visible GPUs when the container starts.
vllm_tensor_parallel_size: 1
vllm_extra_args: ""
vllm_seed: 3407
vllm_drop_page_cache_before_start: false

vllm_ray_enabled: false
vllm_ray_address:
vllm_ray_extra_args: ""
vllm_ray_host_tmp_dir: "/home/{{ ansible_user }}/ansible/ray-head/tmp/ray"
vllm_ray_tmpdir: /tmp/ray
vllm_ray_network_mode:
vllm_host_ip: "{{ ansible_default_ipv4.address }}"
vllm_extra_args_list: []

vllm_api_key:
# Optional; only needed for gated or private Hugging Face repositories.
vllm_hf_token: ""
vllm_override_generation_config:

# NVIDIA recommends --ipc=host (or shared /dev/shm) plus raised memlock/stack
# ulimits for vLLM containers, since the default 64MB Docker shm limit is too
# small for its inter-process tensor transport. Off by default; enable per
# deployment via vllm_ipc_host / vllm_ulimits.
vllm_ipc_host: false
vllm_ulimits: {}
# Optional docker compose security_opt entries. Needed by recipes that use
# io_uring inside the container: the default Docker seccomp profile blocks
# the io_uring syscalls (example: eugr/spark-vllm-b12x with
# B12X_DISK_BACKEND=io_uring).
# Example:
#   vllm_security_opts:
#     - seccomp=unconfined
#     - apparmor=unconfined
vllm_security_opts: []

# --- Optional post-deploy verification ---------------------------------------
# When enabled, after the service becomes healthy the role sends
# GET /v1/models and one small /v1/chat/completions request and asserts
# meaningful responses. Requests are sent from the Ansible controller to
# http://<host default IPv4>:<vllm_port>, so that address must be reachable
# from the controller.
vllm_verify_enabled: false
# Verification probe sent after the server becomes healthy:
# 'chat' — POST /v1/chat/completions (generative chat models);
# 'embed' — POST /v1/embeddings (pooling/embedding models);
# a score/rerank server is not covered by either probe yet.
vllm_verify_mode: chat
# Per-request timeout in seconds.
vllm_verify_timeout: 300
# Sampling settings for the verification completion (deterministic by default).
vllm_verify_max_tokens: 512
vllm_verify_temperature: 0
# Prompt for the verification completion. Default asks a simple question
# with a single unambiguous correct answer, and vllm_verify_expect_contains
# checks the content actually contains that answer — the probe proves the
# model produces correct responses, not just non-empty ones. When overriding
# the prompt, override the expected substring too.
vllm_verify_prompt: "What is 2 + 2? Reply with only the number."
# Case-insensitive substring expected in the completion content; the
# verification fails when it is missing.
vllm_verify_expect_contains: "4"
# Optional tool-calling probe (chat mode only): when enabled, a second chat
# request is sent with a small function schema and tool_choice "auto", and the
# role asserts the model returns a valid OpenAI tool_calls response
# (finish_reason "tool_calls", expected function name, JSON-parsable
# arguments). On by default for chat deployments; requires the deployment to
# serve with --enable-auto-tool-choice and a --tool-call-parser — set it to
# false for chat models without tool support.
vllm_verify_tool_call_enabled: true
# Prompt for the tool-call probe; default asks for the provided tool usage so
# the model is expected to emit a tool call instead of answering in content.
vllm_verify_tool_prompt: "What is the current weather in Paris? Use the provided tool."
# Tools schema (JSON string) sent with the tool-call probe.
vllm_verify_tools: >-
  [{"type": "function", "function": {"name": "get_weather",
  "description": "Get current weather for a city",
  "parameters": {"type": "object",
  "properties": {"city": {"type": "string", "description": "City name"},
  "unit": {"type": "string", "enum": ["celsius", "fahrenheit"]}},
  "required": ["city"]}}}]
# Function name expected in the returned tool call.
vllm_verify_tool_function_name: "get_weather"
