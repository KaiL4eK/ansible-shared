---
- name: Read current Hermes model provider
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - get
      - model.provider
  environment: "{{ hermes_agent_runtime_environment }}"
  register: hermes_agent_current_model_provider
  changed_when: false
  failed_when: hermes_agent_current_model_provider.rc != 0

- name: Set Hermes model provider
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - set
      - model.provider
      - "{{ hermes_agent_model_provider }}"
  environment: "{{ hermes_agent_runtime_environment }}"
  when: hermes_agent_current_model_provider.stdout | trim != hermes_agent_model_provider
  changed_when: true
  notify: Restart Hermes gateway

- name: Read current Hermes default model
  become: true
