---
- name: Restart Hermes Agent gateway
  become: true
  become_user: "{{ hermes_agent_mcp_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_mcp_binary_path }}"
      - gateway
      - restart
  environment:
    HOME: "{{ hermes_agent_mcp_user_home }}"
    HERMES_HOME: "{{ hermes_agent_mcp_home }}"
  register: hermes_agent_mcp_gateway_restart_result
  changed_when: hermes_agent_mcp_gateway_restart_result.rc == 0
  failed_when: hermes_agent_mcp_gateway_restart_result.rc != 0
