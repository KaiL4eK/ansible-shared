---
llama_cpp_use_gpu: true

# https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp
llama_cpp_image: ghcr.io/ggml-org/llama.cpp
llama_cpp_version: server-cuda

# Set to false when a locally built image is used (e.g. llama.cpp:server-cuda-mtp)
llama_cpp_pull_enabled: true

# Optional Bearer API key; rendered into the role-managed .env (mode 0600)
# and consumed by llama-server via LLAMA_API_KEY. /health stays public.
# Example: "{{ vault_api_key }}"
llama_cpp_api_key: ""

# Compose healthcheck start period; the first start may download model
# weights, which can take a long time for large GGUF files. Example: 1h
llama_cpp_healthcheck_start_period: 30s

# Timeout for the Compose wait on service start; must cover the first start
# model download. Example: 1800
llama_cpp_compose_wait_timeout: 1800

# --- Local image build -------------------------------------------------------
# Prebuilt llama.cpp images do not cover every GPU; NVIDIA DGX Spark (GB10,
# sm_121a) for example requires a CUDA 13 build with CMAKE_CUDA_ARCHITECTURES=121a.
# Enable the build to clone, compile llama-server on the target host and run it
# from the resulting image instead of llama_cpp_image:llama_cpp_version.
llama_cpp_build_enabled: false
llama_cpp_source_repo: https://github.com/ggml-org/llama.cpp.git
# Full 40-hex commit SHA of the source to build.
llama_cpp_revision: null
# Optional Ansible host architecture check, e.g. aarch64.
llama_cpp_required_architecture: null
# CUDA build/runtime image version; GB10 needs 13.x for sm_121a.
llama_cpp_cuda_version: 13.0.2
# CMake CUDA target, e.g. 121a for DGX Spark GB10.
llama_cpp_cuda_architectures: null
llama_cpp_build_parallelism: 2
# Extra CMake defines for the build.
# Example: {GGML_CUDA_FA_ALL_QUANTS: "ON"} to support flash attention with
# quantized (q8_0) KV cache on CUDA.
llama_cpp_build_config: {}
# Optional explicit image name; otherwise derive it from source and Dockerfile.
llama_cpp_build_image: null

llama_cpp_port: 8080
llama_cpp_host: 0.0.0.0
# 0 - Full context
llama_cpp_ctx_size: 0
llama_cpp_gpu_layers: 999
# Additional llama-server options, e.g. "--cpu-moe"
llama_cpp_additional_options: ""
llama_cpp_threads: 8
llama_cpp_batch_size: 512
llama_cpp_ubatch_size: 512
llama_cpp_n_predict: -1

llama_cpp_hf_model_repo: bartowski/Llama-3.1-8B-Instruct-GGUF
llama_cpp_hf_model_revision: main
# Optional; only needed for gated or private Hugging Face repositories.
llama_cpp_hf_token: ""

# Optional exact model filename from repository for -hf mode.
# Example: gpt-oss-20b-mxfp4.gguf
llama_cpp_hf_model_file: ""

# Optional draft model path for speculative decoding (--model-draft).
# Example: /models/mtp-shared-Q8_0.gguf
llama_cpp_draft_model: ""

# Extra environment variables for the container.
# Example: {LLAMA_ATTN_ROT_DISABLE: "1"}
llama_cpp_extra_env: {}

# Optional mmproj filename/path for multimodal models.
# Example: unsloth/Qwen3.5-35B-A3B-GGUF/mmproj-F16.gguf
llama_cpp_hf_mmproj_file: ""

ansible_remote_dir: "/home/{{ ansible_user }}/ansible/llama-cpp-{{ llama_cpp_hf_model_repo | replace('/', '_') | replace(':', '_') }}"
llama_cpp_compose_project_name: "{{ ansible_remote_dir | basename }}"
# Keep cache files isolated per deployment under ansible_remote_dir/model
llama_cpp_host_models_dir: "{{ ansible_remote_dir }}/model"
llama_cpp_container_models_dir: /models

# Internal state shared between the prepare and start steps.
llama_cpp_effective_image: null
llama_cpp_source_checkout: {}
llama_cpp_build_rendered: {}
