---
# Обеспечение root-кредов для credentials_source=generated (REQ: плейбук может
# не передавать админ-секрет — роль генерирует его сама и переиспользует из
# кластера при повторных прогонах; значения никогда не печатаются).
# Полное имя чарта (rustfs.fullname): Release.Name, если содержит имя чарта
# "rustfs", иначе "<release>-rustfs" — секрет чарта: <fullname>-secret.
- name: Compute the chart fullname and admin Secret name
  ansible.builtin.set_fact:
    k8s_rustfs_fullname: >-
      {{ k8s_rustfs_release_name
         if (k8s_rustfs_release_name is search('rustfs'))
         else (k8s_rustfs_release_name ~ '-rustfs') }}
    k8s_rustfs_admin_secret_name: >-
      {{ (k8s_rustfs_release_name
          if (k8s_rustfs_release_name is search('rustfs'))
          else (k8s_rustfs_release_name ~ '-rustfs')) ~ '-secret' }}
  when: k8s_rustfs_credentials_source == 'generated'

- name: Read the existing chart admin Secret from the cluster
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ k8s_rustfs_namespace }}"
    name: "{{ k8s_rustfs_admin_secret_name }}"
  register: k8s_rustfs_existing_admin_secret
  when: k8s_rustfs_credentials_source == 'generated'
  no_log: true

- name: Reuse the admin credentials from the cluster Secret
  ansible.builtin.set_fact:
    k8s_rustfs_access_key: "{{ k8s_rustfs_existing_admin_secret.resources[0].data['RUSTFS_ACCESS_KEY'] | b64decode }}"
    k8s_rustfs_secret_key: "{{ k8s_rustfs_existing_admin_secret.resources[0].data['RUSTFS_SECRET_KEY'] | b64decode }}"
  when:
    - k8s_rustfs_credentials_source == 'generated'
    - k8s_rustfs_existing_admin_secret.resources | length > 0
  no_log: true

- name: Generate new random admin credentials
  # lookup-пути — в vars: без них строки set_fact длиннее лимита ansible-lint
  vars:
    k8s_rustfs_access_lookup: "/dev/null length={{ k8s_rustfs_generated_access_key_length }} chars=ascii_letters,digits"
    k8s_rustfs_secret_lookup: "/dev/null length={{ k8s_rustfs_generated_secret_key_length }} chars=ascii_letters,digits"
  ansible.builtin.set_fact:
    k8s_rustfs_access_key: "{{ lookup('ansible.builtin.password', k8s_rustfs_access_lookup) }}"
    k8s_rustfs_secret_key: "{{ lookup('ansible.builtin.password', k8s_rustfs_secret_lookup) }}"
  when:
    - k8s_rustfs_credentials_source == 'generated'
    - k8s_rustfs_access_key | length == 0
  no_log: true
