---
- name: Validate Hermes Git backup inputs
  ansible.builtin.assert:
    that:
      - hermes_git_backup_repository_url is match('^https://')
      - hermes_git_backup_repository_url | urlsplit('username') | default('', true) | length == 0
      - hermes_git_backup_repository_url | urlsplit('password') | default('', true) | length == 0
      - hermes_git_backup_repository_url | urlsplit('hostname') | length > 0
      - hermes_git_backup_username | length > 0
      - hermes_git_backup_directory is match('^/')
      - hermes_git_backup_branch | length > 0
      - hermes_git_backup_remote | length > 0
      - hermes_git_backup_user | length > 0
      - hermes_git_backup_group | length > 0
      - hermes_git_backup_author_name | length > 0
      - hermes_git_backup_author_email | length > 0
      - hermes_git_backup_commit_message_prefix | length > 0
      - >-
        hermes_git_backup_commit_message_fallback is match(
          '^' ~ (hermes_git_backup_commit_message_prefix | regex_escape)
        )
      - hermes_git_backup_commit_message_max_length is integer
      - >-
        hermes_git_backup_commit_message_max_length >
        (hermes_git_backup_commit_message_prefix | length)
      - hermes_git_backup_digest_fallback | length > 0
      - hermes_git_backup_digest_max_length is integer
      - hermes_git_backup_digest_max_length > 0
      - hermes_git_backup_llm_diff_max_bytes is integer
      - hermes_git_backup_llm_diff_max_bytes > 0
      - hermes_git_backup_config_directory is match('^/')
      - hermes_git_backup_credentials_path is match('^/')
      - hermes_git_backup_marker_path is match('^/')
      - hermes_git_backup_script_path is match('^/')
      - >-
        hermes_git_backup_script_path is match(
          '^' ~ (hermes_git_backup_directory | regex_escape) ~ '/scripts/'
        )
      - hermes_git_backup_cron_jobs_path is match('^/')
      - hermes_git_backup_cron_name | length > 0
      - hermes_git_backup_cron_expression.split() | length == 5
      - "'\n' not in hermes_git_backup_cron_expression"
      - "'\r' not in hermes_git_backup_cron_expression"
      - hermes_git_backup_cron_delivery | length > 0
      - hermes_git_backup_legacy_cron_path is match('^/')

- name: Validate Hermes Git backup token
  ansible.builtin.assert:
    that:
      - hermes_git_backup_token | length > 0
      - "'\n' not in hermes_git_backup_token"
      - "'\r' not in hermes_git_backup_token"
  no_log: true

- name: Configure Hermes GitHub backup environment
  ansible.builtin.include_role:
    name: hermes/agent_env  # noqa role-name[path]
  vars:
    hermes_agent_env_user: "{{ hermes_git_backup_user }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_group: "{{ hermes_git_backup_group }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_user_home: "{{ hermes_git_backup_user_home }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_home: "{{ hermes_git_backup_directory }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_binary_path: "{{ hermes_git_backup_binary_path }}"  # noqa var-naming[no-role-prefix]
    hermes_agent_env_values:  # noqa var-naming[no-role-prefix]
      GITHUB_BACKUP_TOKEN: "{{ hermes_git_backup_github_token }}"
  when: hermes_git_backup_github_token | length > 0

- name: Install Hermes Git backup packages
  ansible.builtin.package:
    name: git
    state: present

- name: Ensure Hermes Git backup directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_git_backup_directory }}"
      mode: "0700"
    - path: "{{ hermes_git_backup_config_directory }}"
      mode: "0700"
    - path: "{{ hermes_git_backup_script_path | dirname }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Manage Hermes Git ignore file
  ansible.builtin.copy:
    content: "{{ hermes_git_backup_gitignore_content }}"
    dest: "{{ hermes_git_backup_directory }}/.gitignore"
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    mode: "0644"

- name: Manage Hermes Git credentials
  ansible.builtin.template:
    src: credentials.j2
    dest: "{{ hermes_git_backup_credentials_path }}"
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    mode: "0600"
  no_log: true

- name: Check whether Hermes Git repository exists
  ansible.builtin.stat:
    path: "{{ hermes_git_backup_directory }}/.git/HEAD"
  register: hermes_git_backup_repository

- name: Initialize Hermes Git repository
  ansible.builtin.command:
    argv:
      - git
      - init
      - "--initial-branch={{ hermes_git_backup_branch }}"
      - "{{ hermes_git_backup_directory }}"
    creates: "{{ hermes_git_backup_directory }}/.git/HEAD"
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  when: not hermes_git_backup_repository.stat.exists

- name: Ensure Hermes Git metadata ownership
  ansible.builtin.file:
    path: "{{ hermes_git_backup_directory }}/.git"
    state: directory
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    recurse: true
  when: not ansible_check_mode or hermes_git_backup_repository.stat.exists

- name: Configure Hermes Git repository
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: local
    repo: "{{ hermes_git_backup_directory }}"
  loop:
    - name: user.name
      value: "{{ hermes_git_backup_author_name }}"
    - name: user.email
      value: "{{ hermes_git_backup_author_email }}"
    - name: "remote.{{ hermes_git_backup_remote }}.url"
      value: "{{ hermes_git_backup_repository_url }}"
    - name: credential.helper
      value: "store --file={{ hermes_git_backup_credentials_path }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  when: not ansible_check_mode or hermes_git_backup_repository.stat.exists

- name: Check whether Hermes Git backup was initialized
  ansible.builtin.stat:
    path: "{{ hermes_git_backup_marker_path }}"
  register: hermes_git_backup_marker

- name: Check remote repository is empty on first initialization
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_git_backup_directory }}"
      - -c
      - credential.helper=
      - -c
      - "credential.helper=store --file={{ hermes_git_backup_credentials_path }}"
      - ls-remote
      - "{{ hermes_git_backup_remote }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: hermes_git_backup_remote_refs
  changed_when: false
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  no_log: true
  when:
    - not ansible_check_mode
    - not hermes_git_backup_marker.stat.exists

- name: Refuse a non-empty remote repository on first initialization
  ansible.builtin.assert:
    that:
      - hermes_git_backup_remote_refs.stdout | trim | length == 0
    fail_msg: The remote repository must not contain refs during first initialization.
  when:
    - not ansible_check_mode
    - not hermes_git_backup_marker.stat.exists

- name: Mark Hermes Git backup as initialized
  ansible.builtin.file:
    path: "{{ hermes_git_backup_marker_path }}"
    state: touch
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when:
    - not ansible_check_mode
    - not hermes_git_backup_marker.stat.exists

- name: Install Hermes Git backup script
  ansible.builtin.template:
    src: git-backup.sh.j2
    dest: "{{ hermes_git_backup_script_path }}"
    owner: "{{ hermes_git_backup_user }}"
    group: "{{ hermes_git_backup_group }}"
    mode: "0700"

- name: Check whether Hermes cron jobs exist
  ansible.builtin.stat:
    path: "{{ hermes_git_backup_cron_jobs_path }}"
  register: hermes_git_backup_cron_jobs_file

- name: Read Hermes cron jobs
  ansible.builtin.slurp:
    src: "{{ hermes_git_backup_cron_jobs_path }}"
  register: hermes_git_backup_cron_jobs_data
  when: hermes_git_backup_cron_jobs_file.stat.exists

- name: Select Hermes Git backup cron job
  ansible.builtin.set_fact:
    hermes_git_backup_matching_cron_jobs: >-
      {{
        (
          (hermes_git_backup_cron_jobs_data.content | b64decode | from_json).jobs
          | default([])
        )
        | selectattr('name', 'equalto', hermes_git_backup_cron_name)
        | list
        if hermes_git_backup_cron_jobs_file.stat.exists
        else []
      }}

- name: Refuse ambiguous Hermes Git backup cron jobs
  ansible.builtin.assert:
    that:
      - hermes_git_backup_matching_cron_jobs | length <= 1
    fail_msg: >-
      Multiple Hermes cron jobs are named {{ hermes_git_backup_cron_name }};
      remove duplicates before applying this role.

- name: Create Hermes Git backup cron job
  ansible.builtin.command:
    argv:
      - "{{ hermes_git_backup_binary_path }}"
      - cron
      - create
      - "{{ hermes_git_backup_cron_expression }}"
      - --name
      - "{{ hermes_git_backup_cron_name }}"
      - --no-agent
      - --script
      - "{{ hermes_git_backup_script_path | basename }}"
      - --deliver
      - "{{ hermes_git_backup_cron_delivery }}"
  environment:
    HOME: "{{ hermes_git_backup_user_home }}"
    HERMES_HOME: "{{ hermes_git_backup_directory }}"
    PATH: >-
      {{ hermes_git_backup_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - hermes_git_backup_matching_cron_jobs | length == 0

- name: Update Hermes Git backup cron job
  ansible.builtin.command:
    argv:
      - "{{ hermes_git_backup_binary_path }}"
      - cron
      - edit
      - "{{ hermes_git_backup_matching_cron_jobs[0].id }}"
      - --schedule
      - "{{ hermes_git_backup_cron_expression }}"
      - --name
      - "{{ hermes_git_backup_cron_name }}"
      - --no-agent
      - --script
      - "{{ hermes_git_backup_script_path | basename }}"
      - --deliver
      - "{{ hermes_git_backup_cron_delivery }}"
  environment:
    HOME: "{{ hermes_git_backup_user_home }}"
    HERMES_HOME: "{{ hermes_git_backup_directory }}"
    PATH: >-
      {{ hermes_git_backup_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - hermes_git_backup_matching_cron_jobs | length == 1
    - >-
      hermes_git_backup_matching_cron_jobs[0].schedule.expr | default('') !=
      hermes_git_backup_cron_expression or
      not hermes_git_backup_matching_cron_jobs[0].no_agent | default(false) or
      hermes_git_backup_matching_cron_jobs[0].script | default('') !=
      (hermes_git_backup_script_path | basename) or
      (
        hermes_git_backup_matching_cron_jobs[0].deliver | default(['local']) !=
        [hermes_git_backup_cron_delivery]
      ) and (
        hermes_git_backup_matching_cron_jobs[0].deliver | default('local') !=
        hermes_git_backup_cron_delivery
      )

- name: Resume Hermes Git backup cron job
  ansible.builtin.command:
    argv:
      - "{{ hermes_git_backup_binary_path }}"
      - cron
      - resume
      - "{{ hermes_git_backup_matching_cron_jobs[0].id }}"
  environment:
    HOME: "{{ hermes_git_backup_user_home }}"
    HERMES_HOME: "{{ hermes_git_backup_directory }}"
    PATH: >-
      {{ hermes_git_backup_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin
  become: true
  become_user: "{{ hermes_git_backup_user }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - hermes_git_backup_matching_cron_jobs | length == 1
    - not hermes_git_backup_matching_cron_jobs[0].enabled | default(true)

- name: Include legacy system cron removal tasks
  ansible.builtin.import_tasks: remove_legacy_system_cron.yml
  when: hermes_git_backup_remove_legacy_system_cron | bool
