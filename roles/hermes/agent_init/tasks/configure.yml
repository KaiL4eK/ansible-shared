  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - get
      - telegram.allow_from
      - --json
  environment: "{{ hermes_agent_runtime_environment }}"
  register: hermes_agent_current_telegram_user_allowlist
  changed_when: false
  failed_when: false
  no_log: true
  when: hermes_agent_telegram_user_ids | length > 0

- name: Set Telegram user allowlist
  become: true
  become_user: "{{ hermes_agent_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_bin }}"
      - config
      - set
      - telegram.allow_from
      - "{{ hermes_agent_telegram_user_ids | map('string') | list | to_json }}"
  environment: "{{ hermes_agent_runtime_environment }}"
  when:
    - hermes_agent_telegram_user_ids | length > 0
    - >-
      hermes_agent_current_telegram_user_allowlist.stdout | trim !=
      (hermes_agent_telegram_user_ids | map('string') | list | to_json)
  changed_when: true
  no_log: true
  notify: Restart Hermes gateway

