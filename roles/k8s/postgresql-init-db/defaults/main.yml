---
# Neutral default; consumers should select their target namespace explicitly.
k8s_postgresql_init_namespace: default
k8s_postgresql_init_job_name: postgresql-init-db
k8s_postgresql_init_image: postgres:17.6-bookworm
k8s_postgresql_init_host: ""
k8s_postgresql_init_port: 5432
k8s_postgresql_init_sslmode: prefer
k8s_postgresql_init_admin_database: postgres
k8s_postgresql_init_database: ""
# Обязателен в режиме готовых Secrets. В режиме credentials непустое имя
# переключает пароль администратора на готовый Secret (пример — штатный
# чарт-Secret bitnami с ключом postgres-password), взаимно исключая
# k8s_postgresql_init_admin_password; креды юзера при этом остаются
# role-managed во временном Secret'е. Значение внешнего Secret'а во
# временный не копируется: Job получает ссылку через secretKeyRef.
k8s_postgresql_init_admin_secret_name: ""
# Username администратора приходит либо этим ключом из готового Secret, либо
# inline через k8s_postgresql_init_admin_user (например postgres для штатного
# чарт-Secret bitnami без ключа username) — ровно один из двух входов
# непустой. В credentials-режиме с inline-паролем ключ инжектится ролью,
# поэтому дефолт пустой.
k8s_postgresql_init_admin_username_key: ""
k8s_postgresql_init_admin_secret_key: POSTGRES_ADMIN_PASSWORD
k8s_postgresql_init_user_secret_name: ""
k8s_postgresql_init_user_username_key: MOT_DATABASE_USERNAME
k8s_postgresql_init_user_secret_key: MOT_DATABASE_PASSWORD
k8s_postgresql_init_timeout: 330
k8s_postgresql_init_manage_credentials: false
# Preflight готовых Secret'ов (режим existing/ready Secrets): ожидание наличия,
# ключей и непустых значений перед созданием Job'а; 12 ретраев × 5s.
k8s_postgresql_init_secret_preflight_retries: 12
# В режиме готовых Secrets задаёт username администратора inline (взаимо-
# исключаем с k8s_postgresql_init_admin_username_key). В режиме credentials —
# username администратора: при inline-пароле попадает во временный Secret,
# при внешнем админ-Secret'е (bitnami-паттерн) остаётся inline-значением
# PGUSER Job'а.
k8s_postgresql_init_admin_user: ""
# Inline-пароль администратора временного Secret'а; в режиме credentials
# взаимно исключаем с k8s_postgresql_init_admin_secret_name — ровно один
# источник пароля администратора.
k8s_postgresql_init_admin_password: ""
k8s_postgresql_init_user: ""
k8s_postgresql_init_password: ""
k8s_postgresql_init_kubeconfig: ""
