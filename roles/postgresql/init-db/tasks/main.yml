---
- name: Validate PostgreSQL DB init input
  ansible.builtin.assert:
    that:
      - postgresql_init_db_user | length > 0
      - postgresql_init_db_name | length > 0
    fail_msg: "postgresql_init_db_user and postgresql_init_db_name are required"

- name: Determine whether admin credentials are provided
  ansible.builtin.set_fact:
    postgresql_init_db_use_admin_credentials: >-
      {{
        (postgresql_init_db_admin_user | length > 0)
        and
        (postgresql_init_db_admin_password | length > 0)
      }}

- name: Inspect existing PostgreSQL user and database
  community.postgresql.postgresql_query:
    login_host: "{{ postgresql_init_db_host }}"
    login_port: "{{ postgresql_init_db_port }}"
    login_user: "{{ postgresql_init_db_admin_user }}"
    login_password: "{{ postgresql_init_db_admin_password }}"
    login_db: "{{ postgresql_init_db_admin_database }}"
    query: >-
      SELECT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = %(app_user)s) AS user_exists,
      (SELECT pg_catalog.pg_get_userbyid(datdba) FROM pg_catalog.pg_database
      WHERE datname = %(app_database)s) AS database_owner
    named_args:
      app_user: "{{ postgresql_init_db_user }}"
      app_database: "{{ postgresql_init_db_name }}"
  register: postgresql_init_db_existing
  changed_when: false
  check_mode: false
  no_log: true
  when: postgresql_init_db_use_admin_credentials

- name: Reject conflicting PostgreSQL database ownership
  ansible.builtin.assert:
    that:
      - >-
        postgresql_init_db_existing.query_result[0].database_owner is none or
        postgresql_init_db_existing.query_result[0].database_owner == postgresql_init_db_user
    fail_msg: "Existing database has a different owner; bootstrap must not change it."
  when: postgresql_init_db_use_admin_credentials

- name: Create application PostgreSQL user only when absent
  community.postgresql.postgresql_user:
    login_host: "{{ postgresql_init_db_host }}"
    login_port: "{{ postgresql_init_db_port }}"
    login_user: "{{ postgresql_init_db_admin_user }}"
    login_password: "{{ postgresql_init_db_admin_password }}"
    login_db: "{{ postgresql_init_db_admin_database }}"
    name: "{{ postgresql_init_db_user }}"
    password: "{{ postgresql_init_db_user_password }}"
    state: present
    role_attr_flags: "{{ postgresql_init_db_role_attr_flags }}"
    encrypted: true
    expires: infinity
    no_password_changes: true
  no_log: true
  when:
    - postgresql_init_db_use_admin_credentials
    - not postgresql_init_db_existing.query_result[0].user_exists

- name: Verify application credentials without modifying existing password
  when: >-
    not ansible_check_mode or not postgresql_init_db_use_admin_credentials or
    postgresql_init_db_existing.query_result[0].user_exists
  block:
    - name: Connect as application user before provisioning database
      community.postgresql.postgresql_query:
        login_host: "{{ postgresql_init_db_host }}"
        login_port: "{{ postgresql_init_db_port }}"
        login_user: "{{ postgresql_init_db_user }}"
        login_password: "{{ postgresql_init_db_user_password }}"
        login_db: "{{ postgresql_init_db_admin_database }}"
        query: SELECT 1
      changed_when: false
      check_mode: false
      no_log: true
  rescue:
    - name: Fail without exposing database credentials
      ansible.builtin.fail:
        msg: >-
          Application database authentication failed; existing password was not changed.
          Check credentials, connectivity and pg_hba.conf.

- name: Ensure database authentication actually validates passwords
  when: >-
    not ansible_check_mode or not postgresql_init_db_use_admin_credentials or
    postgresql_init_db_existing.query_result[0].user_exists
  block:
    - name: Attempt connection with deliberately incorrect password
      community.postgresql.postgresql_query:
        login_host: "{{ postgresql_init_db_host }}"
        login_port: "{{ postgresql_init_db_port }}"
        login_user: "{{ postgresql_init_db_user }}"
        login_password: "{{ postgresql_init_db_user_password }}__bootstrap_invalid__"
        login_db: "{{ postgresql_init_db_admin_database }}"
        query: SELECT 1
      register: postgresql_init_db_invalid_password
      changed_when: false
      check_mode: false
      ignore_errors: true
      no_log: true

    - name: Reject authentication that accepts incorrect passwords
      ansible.builtin.assert:
        that:
          - postgresql_init_db_invalid_password is failed
        fail_msg: >-
          PostgreSQL accepted an incorrect password; bootstrap cannot verify credentials.
          Configure password authentication in pg_hba.conf.

- name: Create PostgreSQL database with admin credentials
  community.postgresql.postgresql_db:
    login_host: "{{ postgresql_init_db_host }}"
    login_port: "{{ postgresql_init_db_port }}"
    login_user: "{{ postgresql_init_db_admin_user }}"
    login_password: "{{ postgresql_init_db_admin_password }}"
    maintenance_db: "{{ postgresql_init_db_admin_database }}"
    name: "{{ postgresql_init_db_name }}"
    owner: "{{ postgresql_init_db_user }}"
    encoding: "{{ postgresql_init_db_encoding if postgresql_init_db_encoding is not none else omit }}"
    lc_collate: "{{ postgresql_init_db_lc_collate if postgresql_init_db_lc_collate is not none else omit }}"
    lc_ctype: "{{ postgresql_init_db_lc_ctype if postgresql_init_db_lc_ctype is not none else omit }}"
    template: "{{ postgresql_init_db_template if postgresql_init_db_template is not none else omit }}"
    state: present
  no_log: true
  when:
    - postgresql_init_db_use_admin_credentials
    - postgresql_init_db_existing.query_result[0].database_owner is none

- name: Inspect database ownership without admin credentials
  community.postgresql.postgresql_query:
    login_host: "{{ postgresql_init_db_host }}"
    login_port: "{{ postgresql_init_db_port }}"
    login_user: "{{ postgresql_init_db_user }}"
    login_password: "{{ postgresql_init_db_user_password }}"
    login_db: "{{ postgresql_init_db_admin_database }}"
    query: >-
      SELECT pg_catalog.pg_get_userbyid(datdba) AS database_owner
      FROM pg_catalog.pg_database WHERE datname = %(app_database)s
    named_args:
      app_database: "{{ postgresql_init_db_name }}"
  register: postgresql_init_db_application_existing
  changed_when: false
  check_mode: false
  no_log: true
  when: not postgresql_init_db_use_admin_credentials

- name: Reject conflicting ownership without admin credentials
  ansible.builtin.assert:
    that:
      - >-
        postgresql_init_db_application_existing.query_result | length == 0 or
        postgresql_init_db_application_existing.query_result[0].database_owner == postgresql_init_db_user
    fail_msg: "Existing database has a different owner; bootstrap must not change it."
  when: not postgresql_init_db_use_admin_credentials

- name: Create PostgreSQL database as application user
  community.postgresql.postgresql_db:
    login_host: "{{ postgresql_init_db_host }}"
    login_port: "{{ postgresql_init_db_port }}"
    login_user: "{{ postgresql_init_db_user }}"
    maintenance_db: "{{ postgresql_init_db_admin_database }}"
    login_password: >-
      {{
        postgresql_init_db_user_password
        if (postgresql_init_db_user_password | length > 0)
        else omit
      }}
    name: "{{ postgresql_init_db_name }}"
    owner: "{{ postgresql_init_db_user }}"
    encoding: "{{ postgresql_init_db_encoding if postgresql_init_db_encoding is not none else omit }}"
    lc_collate: "{{ postgresql_init_db_lc_collate if postgresql_init_db_lc_collate is not none else omit }}"
    lc_ctype: "{{ postgresql_init_db_lc_ctype if postgresql_init_db_lc_ctype is not none else omit }}"
    template: "{{ postgresql_init_db_template if postgresql_init_db_template is not none else omit }}"
    state: present
  when:
    - not postgresql_init_db_use_admin_credentials
    - postgresql_init_db_application_existing.query_result | length == 0
  no_log: true
