---
- name: Validate PostgreSQL initialization Job inputs
  ansible.builtin.assert:
    that:
      - k8s_postgresql_init_namespace | length > 0
      - k8s_postgresql_init_job_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - k8s_postgresql_init_job_name | length <= 40
      - "':' in k8s_postgresql_init_image"
      - k8s_postgresql_init_image.split(':')[-1] not in ['latest', 'stable', 'main']
      - k8s_postgresql_init_host | length > 0
      - k8s_postgresql_init_port | int in range(1, 65536)
      - k8s_postgresql_init_database is match('^[a-zA-Z_][a-zA-Z0-9_-]{0,62}$')
      - k8s_postgresql_init_admin_secret_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - k8s_postgresql_init_user_secret_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - k8s_postgresql_init_admin_username_key | length > 0
      - k8s_postgresql_init_admin_secret_key | length > 0
      - k8s_postgresql_init_user_username_key | length > 0
      - k8s_postgresql_init_user_secret_key | length > 0
      - k8s_postgresql_init_timeout | int > 30
  no_log: true

- name: Create short-lived PostgreSQL initialization Job
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "{{ k8s_postgresql_init_job_name }}"
        namespace: "{{ k8s_postgresql_init_namespace }}"
        labels:
          app.kubernetes.io/name: postgresql-init-db
          app.kubernetes.io/managed-by: ansible
      spec:
        backoffLimit: 1
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: 600
        template:
          metadata:
            labels:
              app.kubernetes.io/name: postgresql-init-db
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            containers:
              - name: initialize
                image: "{{ k8s_postgresql_init_image }}"
                imagePullPolicy: IfNotPresent
                command: [/bin/sh, -ec]
                args:
                  - |
                    # Do not expose generated password-bearing SQL on server errors.
                    if ! psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 >/dev/null 2>&1 <<'SQL'
                    \getenv app_user APP_DB_USER
                    \getenv app_password APP_DB_PASSWORD
                    \getenv app_database APP_DATABASE

                    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
                    WHERE NOT EXISTS (
                      SELECT FROM pg_catalog.pg_roles WHERE rolname = :'app_user'
                    )
                    \gexec

                    SQL
                    then
                      echo 'PostgreSQL user bootstrap failed; existing password was not changed.' >&2
                      exit 1
                    fi

                    if ! PGUSER="$APP_DB_USER" PGPASSWORD="$APP_DB_PASSWORD" \
                      psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                      --command='SELECT 1' >/dev/null 2>&1; then
                      echo 'Application database authentication failed; existing password was not changed.' >&2
                      exit 1
                    fi

                    if PGUSER="$APP_DB_USER" PGPASSWORD="${APP_DB_PASSWORD}__bootstrap_invalid__" \
                      psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                      --command='SELECT 1' >/dev/null 2>&1; then
                      echo 'PostgreSQL accepted an incorrect password; configure password authentication.' >&2
                      exit 1
                    fi

                    psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
                    \getenv app_user APP_DB_USER
                    \getenv app_database APP_DATABASE

                    SELECT EXISTS (
                      SELECT FROM pg_catalog.pg_database
                      WHERE datname = :'app_database'
                        AND pg_catalog.pg_get_userbyid(datdba) <> :'app_user'
                    ) AS owner_conflict
                    \gset
                    \if :owner_conflict
                      DO $$ BEGIN
                        RAISE EXCEPTION 'Existing database has a different owner; bootstrap must not change it.';
                      END $$;
                    \endif

                    SELECT format('CREATE DATABASE %I OWNER %I', :'app_database', :'app_user')
                    WHERE NOT EXISTS (
                      SELECT FROM pg_catalog.pg_database WHERE datname = :'app_database'
                    )
                    \gexec

                    SQL
                env:
                  - name: PGHOST
                    value: "{{ k8s_postgresql_init_host }}"
                  - name: PGPORT
                    value: "{{ k8s_postgresql_init_port | string }}"
                  - name: PGDATABASE
                    value: "{{ k8s_postgresql_init_admin_database }}"
                  - name: PGUSER
                    valueFrom:
                      secretKeyRef:
                        name: "{{ k8s_postgresql_init_admin_secret_name }}"
                        key: "{{ k8s_postgresql_init_admin_username_key }}"
                  - name: PGSSLMODE
                    value: "{{ k8s_postgresql_init_sslmode }}"
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ k8s_postgresql_init_admin_secret_name }}"
                        key: "{{ k8s_postgresql_init_admin_secret_key }}"
                  - name: APP_DATABASE
                    value: "{{ k8s_postgresql_init_database }}"
                  - name: APP_DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: "{{ k8s_postgresql_init_user_secret_name }}"
                        key: "{{ k8s_postgresql_init_user_username_key }}"
                  - name: APP_DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ k8s_postgresql_init_user_secret_name }}"
                        key: "{{ k8s_postgresql_init_user_secret_key }}"
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 250m
                    memory: 128Mi
  register: k8s_postgresql_init_job
  diff: false

- name: Wait until PostgreSQL initialization Job completes or fails
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ k8s_postgresql_init_namespace }}"
    name: "{{ k8s_postgresql_init_job_name }}"
  register: k8s_postgresql_init_job_status
  until:
    - k8s_postgresql_init_job_status.resources | length == 1
    - >-
      (k8s_postgresql_init_job_status.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True') | list | length > 0) or
      (k8s_postgresql_init_job_status.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Failed') | selectattr('status', 'equalto', 'True') | list | length > 0)
  retries: "{{ (k8s_postgresql_init_timeout | int // 5) + 1 }}"
  delay: 5

- name: Verify PostgreSQL initialization Job completed successfully
  ansible.builtin.assert:
    that:
      - k8s_postgresql_init_job_status.resources | length == 1
      - >-
        k8s_postgresql_init_job_status.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: PostgreSQL initialization Job failed; inspect its pod logs in the target namespace.
