---
- name: Validate public temporary credential mode inputs
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - k8s_postgresql_init_namespace | length > 0
      - k8s_postgresql_init_job_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - k8s_postgresql_init_job_name | length <= 34
      - k8s_postgresql_init_user | length > 0
      - k8s_postgresql_init_user_secret_name | length == 0
      # Пароль администратора приходит либо inline, либо из готового Secret
      # (пример — штатный чарт-Secret bitnami с ключом postgres-password);
      # ровно один из двух источников. Креды юзера всегда role-managed.
      - >-
        (k8s_postgresql_init_admin_password | length > 0)
        != (k8s_postgresql_init_admin_secret_name | length > 0)
      - >-
        (k8s_postgresql_init_admin_secret_name | length == 0)
        or (k8s_postgresql_init_admin_secret_key | length > 0)
    fail_msg: >-
      Provide public database inputs without a user Secret name, exactly one
      administrator password source (inline k8s_postgresql_init_admin_password
      or ready k8s_postgresql_init_admin_secret_name with
      k8s_postgresql_init_admin_secret_key), and run without check mode.

- name: Validate the temporary application PostgreSQL credential value
  ansible.builtin.assert:
    that:
      - k8s_postgresql_init_password | length > 0
    fail_msg: Provide the application PostgreSQL password.
  no_log: true
  diff: false

- name: Check the explicitly selected kubeconfig without reading it
  ansible.builtin.stat:
    path: "{{ k8s_postgresql_init_kubeconfig }}"
    get_checksum: false
    get_mime: false
  register: k8s_postgresql_init_kubeconfig_info
  when: k8s_postgresql_init_kubeconfig | length > 0

- name: Validate the explicitly selected kubeconfig exists
  ansible.builtin.assert:
    that:
      - k8s_postgresql_init_kubeconfig_info.stat.isreg | default(false)
  when: k8s_postgresql_init_kubeconfig | length > 0

- name: Check the target namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ k8s_postgresql_init_namespace }}"
  register: k8s_postgresql_init_namespace_info

- name: Require an existing target namespace
  ansible.builtin.assert:
    that:
      - k8s_postgresql_init_namespace_info.resources | length == 1
    fail_msg: Create the target namespace before initializing the database.

- name: Initialize database with a temporary credential Secret
  vars:
    # Эффективные ссылки администратора для Job: при внешнем готовом Secret'е
    # (гибрид) — ссылки потребителя, при inline-пароле — ключи временного
    # Secret'а. Username при внешнем Secret'е остаётся inline-значением
    # потребителя, при inline-пароле инжектится ключом ADMIN_USERNAME.
    k8s_postgresql_init_job_admin_secret_name: >-
      {{ k8s_postgresql_init_admin_secret_name
         if k8s_postgresql_init_admin_secret_name | length > 0
         else k8s_postgresql_init_credentials_secret.result.metadata.name }}
    k8s_postgresql_init_job_admin_username_key: >-
      {{ k8s_postgresql_init_admin_username_key
         if k8s_postgresql_init_admin_secret_name | length > 0
         else 'ADMIN_USERNAME' }}
    k8s_postgresql_init_job_admin_secret_key: >-
      {{ k8s_postgresql_init_admin_secret_key
         if k8s_postgresql_init_admin_secret_name | length > 0
         else 'ADMIN_PASSWORD' }}
    k8s_postgresql_init_job_admin_user: >-
      {{ k8s_postgresql_init_admin_user
         if k8s_postgresql_init_admin_secret_name | length > 0
         else '' }}
    # Значение внешнего админ-Secret'а (гибрид) во временный не копируется:
    # Job ссылается на готовый Secret через secretKeyRef.
    k8s_postgresql_init_temp_secret_data: >-
      {{ {'APP_USERNAME': k8s_postgresql_init_user,
          'APP_PASSWORD': k8s_postgresql_init_password}
         | combine({'ADMIN_USERNAME': k8s_postgresql_init_admin_user,
                    'ADMIN_PASSWORD': k8s_postgresql_init_admin_password}
                   if k8s_postgresql_init_admin_secret_name | length == 0
                   else {}) }}
  block:
    - name: Create a uniquely named temporary database credentials Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            generateName: "{{ k8s_postgresql_init_job_name }}-"
            namespace: "{{ k8s_postgresql_init_namespace }}"
            labels:
              app.kubernetes.io/name: postgresql-init-db
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData: "{{ k8s_postgresql_init_temp_secret_data }}"
      register: k8s_postgresql_init_credentials_secret
      no_log: true
      diff: false

    - name: Initialize database using the generated Secret and a unique Job name
      ansible.builtin.include_tasks: job.yml
      vars:
        k8s_postgresql_init_job_name: "{{ k8s_postgresql_init_credentials_secret.result.metadata.name }}"
        k8s_postgresql_init_admin_secret_name: "{{ k8s_postgresql_init_job_admin_secret_name }}"
        k8s_postgresql_init_admin_username_key: "{{ k8s_postgresql_init_job_admin_username_key }}"
        k8s_postgresql_init_admin_secret_key: "{{ k8s_postgresql_init_job_admin_secret_key }}"
        # Username приходит ключом из временного Secret (inline-пароль) либо
        # остаётся inline-значением потребителя (внешний админ-Secret), чтобы
        # сохранить XOR-контракт job.yml.
        k8s_postgresql_init_admin_user: "{{ k8s_postgresql_init_job_admin_user }}"
        k8s_postgresql_init_user_secret_name: "{{ k8s_postgresql_init_credentials_secret.result.metadata.name }}"
        k8s_postgresql_init_user_username_key: APP_USERNAME
        k8s_postgresql_init_user_secret_key: APP_PASSWORD

  always:
    - name: Remove the temporary database credentials Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ k8s_postgresql_init_namespace }}"
        name: "{{ k8s_postgresql_init_credentials_secret.result.metadata.name }}"
      when:
        - k8s_postgresql_init_credentials_secret is defined
        - k8s_postgresql_init_credentials_secret.result is defined
        - k8s_postgresql_init_credentials_secret.result.metadata is defined
        - k8s_postgresql_init_credentials_secret.result.metadata.name is defined
      no_log: true
      diff: false
