---
# Inline-режим: значения кредов → временный Secret (generateName, no_log) →
# Job'ы через secretKeyRef на временный Secret → удаление в always.
# Значения наружу не печатаются; во временный Secret не копируются значения
# сторон, идущих через готовые Secret'ы (гибрид: Job ссылается на оба).
- name: Validate the inline credential values
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      # Inline-креды каждой стороны — только полными парами значений
      - >-
        (minio_mc_init_root_access_key_value | length == 0)
        == (minio_mc_init_root_secret_value | length == 0)
      - >-
        (minio_mc_init_app_access_key_value | length == 0)
        == (minio_mc_init_app_secret_value | length == 0)
      - >-
        (minio_mc_init_root_access_key_value | length > 0)
        or (minio_mc_init_app_access_key_value | length > 0)
    fail_msg: >-
      Provide each inline credential source (root / application user) as a
      pair of values and at least one inline source, then run without check
      mode.

- name: Initialize with a temporary credentials Secret
  vars:
    # merge dict'ов только через combine: оператор + для dict в Jinja/Python
    # не определён ('unsupported operand type(s) for +: dict and dict',
    # кейс первого prod-прогона inline-режима, 2026-11-10)
    minio_mc_init_temp_secret_data: >-
      {{ ({'ROOT_ACCESS_KEY': minio_mc_init_root_access_key_value,
           'ROOT_SECRET_KEY': minio_mc_init_root_secret_value}
          if minio_mc_init_root_access_key_value | length > 0 else {})
        | combine({'APP_ACCESS_KEY': minio_mc_init_app_access_key_value,
                   'APP_SECRET': minio_mc_init_app_secret_value}
                  if minio_mc_init_app_access_key_value | length > 0 else {}) }}
  block:
    - name: Create a uniquely named temporary S3 credentials Secret
      block:
        - name: Create the temporary credentials Secret with generateName
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                generateName: "{{ minio_mc_init_job_name }}-"
                namespace: "{{ minio_mc_init_namespace }}"
                labels: "{{ minio_mc_init_labels }}"
              type: Opaque
              stringData: "{{ minio_mc_init_temp_secret_data }}"
          register: minio_mc_init_credentials_secret
          no_log: true
          diff: false
      rescue:
        # Полный вывод задачи скрыт no_log: msg упавшего модуля включает
        # module_args со значениями inline-кредов. Наружу — sanitized-сводка:
        # HTTP-код из тела ответа API, reason и перескрабленный полный msg
        # (поле message тела Status видно внутри него). Тексты чистятся от
        # inline-значений и их base64-форм (подстрочная замена <redacted>;
        # осознанно может частично замылить текст — перескраб безопаснее
        # недоскраба). Паттерн — rescue-блок k8s/publish-secrets (ADR-70):
        # скраб списка текстов map'ом regex_replace в цикле по токенам;
        # Jinja литералы передают бэкслеши как есть — regex'ы с одиночными
        # \d (рендер-тест в .tmp/).
        - name: Collect the temporary Secret creation failure info under no_log
          ansible.builtin.set_fact:
            minio_mc_init_create_failure_code: >-
              {{ minio_mc_init_credentials_secret.msg | default('', true)
                 | regex_findall('"code":(\d+)') | join('') or '-' }}
            minio_mc_init_create_failure_reason: >-
              {{ minio_mc_init_credentials_secret.reason | default('unknown') }}
            minio_mc_init_create_failure_texts: >-
              {{ [minio_mc_init_credentials_secret.msg | default('', true)] }}
          no_log: true

        - name: Collect the inline credential values for scrubbing under no_log
          ansible.builtin.set_fact:
            minio_mc_init_scrub_tokens: >-
              {{ [minio_mc_init_root_access_key_value,
                  minio_mc_init_root_secret_value,
                  minio_mc_init_app_access_key_value,
                  minio_mc_init_app_secret_value]
                 | select('string') | select('ne', '') | list }}
          no_log: true

        - name: Scrub the inline credential values and their b64 forms from the texts under no_log
          ansible.builtin.set_fact:
            minio_mc_init_create_failure_texts: >-
              {{ minio_mc_init_create_failure_texts
                 | map('regex_replace', item | regex_escape, '<redacted>') | list }}
          loop: "{{ minio_mc_init_scrub_tokens
                    + (minio_mc_init_scrub_tokens | map('b64encode') | list) }}"
          no_log: true

        - name: Fail with the sanitized temporary Secret creation diagnostics
          ansible.builtin.fail:
            msg: >-
              Temporary credentials Secret creation failed in namespace
              {{ minio_mc_init_namespace }}:
              code={{ minio_mc_init_create_failure_code }},
              reason={{ minio_mc_init_create_failure_reason }};
              full msg (scrubbed)={{ minio_mc_init_create_failure_texts | first }}


    - name: Compute effective credential Secret references for the Jobs
      # Eager set_fact, а не ленивые vars на include: include-переменные
      # затеняют входы роли, и ленивая ссылка на затеняемое имя уходит в
      # рекурсию шаблонизации (кейс k8s/postgresql-init-db, 2026-10-29;
      # первый prod-прогон mc-init-user-bucket дал пустые secretKeyRef в
      # Job'ах — 2026-11-10). Значения — только имена Secret'ов и ключей,
      # без секретных значений. Стороны независимы (гибрид допустим):
      # на каждой стороне значение из готового Secret'а, если вход задан,
      # иначе — временный Secret с фиксированными inline-ключами.
      ansible.builtin.set_fact:
        minio_mc_init_job_root_secret_name: >-
          {{ minio_mc_init_root_secret_name
             if minio_mc_init_root_secret_name | length > 0
             else minio_mc_init_credentials_secret.result.metadata.name }}
        minio_mc_init_job_root_access_key: >-
          {{ minio_mc_init_root_access_key
             if minio_mc_init_root_secret_name | length > 0
             else 'ROOT_ACCESS_KEY' }}
        minio_mc_init_job_root_secret_key: >-
          {{ minio_mc_init_root_secret_key
             if minio_mc_init_root_secret_name | length > 0
             else 'ROOT_SECRET_KEY' }}
        minio_mc_init_job_app_secret_name: >-
          {{ minio_mc_init_app_secret_name
             if minio_mc_init_app_secret_name | length > 0
             else minio_mc_init_credentials_secret.result.metadata.name }}
        minio_mc_init_job_app_access_key: >-
          {{ minio_mc_init_app_access_key
             if minio_mc_init_app_secret_name | length > 0
             else 'APP_ACCESS_KEY' }}
        minio_mc_init_job_app_secret_key: >-
          {{ minio_mc_init_app_secret_key
             if minio_mc_init_app_secret_name | length > 0
             else 'APP_SECRET' }}

    - name: Run the mc initialization Jobs sequentially
      ansible.builtin.include_tasks: job.yml
      # Include-vars затеняют входы роли для Job'ов, но ссылаются на
      # eager-факты выше: passthrough вычисленных значений безопасен,
      # ленивая ссылка на затеняемое имя — нет (см. комментарий к
      # set_fact). В secret-режиме include-vars нет — используются
      # входы роли напрямую.
      vars:
        minio_mc_init_root_secret_name: "{{ minio_mc_init_job_root_secret_name }}"
        minio_mc_init_root_access_key: "{{ minio_mc_init_job_root_access_key }}"
        minio_mc_init_root_secret_key: "{{ minio_mc_init_job_root_secret_key }}"
        minio_mc_init_app_secret_name: "{{ minio_mc_init_job_app_secret_name }}"
        minio_mc_init_app_access_key: "{{ minio_mc_init_job_app_access_key }}"
        minio_mc_init_app_secret_key: "{{ minio_mc_init_job_app_secret_key }}"

  always:
    - name: Remove the temporary S3 credentials Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ minio_mc_init_namespace }}"
        name: "{{ minio_mc_init_credentials_secret.result.metadata.name }}"
      when:
        - minio_mc_init_credentials_secret is defined
        - minio_mc_init_credentials_secret.result is defined
        - minio_mc_init_credentials_secret.result.metadata is defined
        - minio_mc_init_credentials_secret.result.metadata.name is defined
      no_log: true
      diff: false
