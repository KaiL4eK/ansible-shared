---
- name: Validate Node.js runtime requirements
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['x86_64', 'aarch64', 'armv7l']
      - nodejs_runtime_major_version | int >= 24
      - nodejs_runtime_minimum_npm_major_version | int >= 11
      - nodejs_runtime_key_path is match('^/')
      - nodejs_runtime_sources_path is match('^/')
    fail_msg: NodeSource Node.js runtime requires a supported Debian/Ubuntu host.

- name: Install NodeSource repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: "{{ nodejs_runtime_key_path | dirname }}"
    state: directory
    mode: "0755"

- name: Download NodeSource repository signing key
  ansible.builtin.get_url:
    url: "{{ nodejs_runtime_key_url }}"
    dest: "{{ nodejs_runtime_key_path }}"
    mode: "0644"
  register: nodejs_runtime_key_result

- name: Configure NodeSource repository
  ansible.builtin.copy:
    dest: "{{ nodejs_runtime_sources_path }}"
    content: >
      deb [signed-by={{ nodejs_runtime_key_path }}]
      https://deb.nodesource.com/node_{{ nodejs_runtime_major_version }}.x nodistro main
    mode: "0644"
  register: nodejs_runtime_repository_result

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: "nodejs={{ nodejs_runtime_major_version }}.*"
    state: present
    update_cache: true
    cache_valid_time: >-
      {{ 0 if nodejs_runtime_key_result.changed or
         nodejs_runtime_repository_result.changed else 3600 }}
  when: not ansible_check_mode

- name: Verify Node.js version
  ansible.builtin.command: node --version
  register: nodejs_runtime_node_version
  changed_when: false
  when: not ansible_check_mode

- name: Verify npm version
  ansible.builtin.command: npm --version
  register: nodejs_runtime_npm_version
  changed_when: false
  when: not ansible_check_mode

- name: Assert compatible Node.js and npm versions
  ansible.builtin.assert:
    that:
      - nodejs_runtime_node_version.stdout is match('^v[0-9]+\\.')
      - nodejs_runtime_npm_version.stdout is match('^[0-9]+\\.')
      - nodejs_runtime_node_version.stdout | regex_replace('^v([0-9]+)\\..*', '\\1') | int >= nodejs_runtime_major_version | int
      - nodejs_runtime_npm_version.stdout | regex_replace('^([0-9]+)\\..*', '\\1') | int >= nodejs_runtime_minimum_npm_major_version | int
    fail_msg: The installed Node.js or npm version is too old for Todoist MCP.
  when: not ansible_check_mode
