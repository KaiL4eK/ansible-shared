---
- name: Restart Hermes gateway after memory configuration
  become: true
  become_user: "{{ hermes_agent_memory_user }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_memory_binary_path }}"
      - gateway
      - restart
  environment: "{{ hermes_agent_memory_runtime_environment }}"
  register: hermes_agent_memory_gateway_restart_result
  changed_when: hermes_agent_memory_gateway_restart_result.rc == 0
  failed_when: hermes_agent_memory_gateway_restart_result.rc != 0
